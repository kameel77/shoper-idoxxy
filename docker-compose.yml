version: "3.8"

services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - shoper-idoxxy-data:/app/data
    networks:
      coolify:
        aliases:
          # WAŻNE: Zgodnie z wytycznymi w SKILL.md zapobiegamy kolizji nazw hostów
          # pomiędzy środowiskami produkcyjnymi i testowymi.
          - "${COMPOSE_PROJECT_NAME}-shoper-idoxxy-backend"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/app.db
      # Zmienne, które należy uzupełnić w panelu Coolify (Environment Variables):
      # - SHOPER_CLIENT_ID
      # - SHOPER_CLIENT_SECRET
      # - SHOPER_APP_STORE_CLIENT_ID
      # - SESSION_SECRET (Wymagane! min. 32 znaki - patrz src/config/env.ts)
      # - SHOPER_WEBHOOK_SECRET (Wymagane! min. 32 znaki - bez niego webhooki
      #   customer/order są akceptowane bez weryfikacji podpisu - patrz src/config/env.ts)
      # - SHOPER_APPSTORE_SECRET (Wymagane! sekret App Store z panelu deweloperskiego Shoper -
      #   bez niego callbacki uninstall/billing są akceptowane bez weryfikacji podpisu)
      # - TOKEN_ENCRYPTION_KEY (Wymagane! base64, 32 bajty - wygeneruj przez:
      #   openssl rand -base64 32 - bez niego tokeny sklepów nie są realnie szyfrowane)
      # - ADMIN_USERNAME (opcjonalne, domyślnie "admin")
      # - ADMIN_PASSWORD (Wymagane! min. 16 znaków - konto administratora ma dostęp
      #   do połączeń wszystkich sklepów (GET /settings/link/connections) i może
      #   działać na dowolnym sklepie przez ?shopId=. Bez silnego hasła - lub jeśli
      #   istniejące konto administratora nadal używa starego domyślnego hasła -
      #   aplikacja NIE uruchomi się na produkcji - patrz src/config/env.ts i
      #   src/repositories/userRepository.ts)
      # - SYNC_LOG_RETENTION_DAYS (opcjonalne, domyślnie 90; dodatnia liczba całkowita,
      #   0 jest odrzucane - RODO: okres przechowywania e-maili klientów sklepu w sync_logs)
      # - UNINSTALL_PURGE_GRACE_DAYS (opcjonalne, domyślnie 30; dodatnia liczba całkowita -
      #   RODO: po tylu dniach od odinstalowania trwale usuwane są dane sklepu)

volumes:
  shoper-idoxxy-data:

networks:
  coolify:
    external: true
